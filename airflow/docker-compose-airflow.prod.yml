# Airflow configuration for the production host (dedicated EC2 instance).
# See docs/PROD_AIRFLOW_EC2_RUNBOOK.md for how this instance is provisioned.
#
# Standalone file (not merged with docker-compose-airflow.yml): compose merges
# list-type fields like `volumes` by target path and only appends/replaces
# matching entries, it does not let an override *remove* an entry the base
# file defines — so dropping the ~/.aws/credentials mount safely requires a
# separate file rather than `-f docker-compose-airflow.yml -f ...prod.yml`.
#
# Usage: docker compose -f docker-compose-airflow.prod.yml up -d
#
# Unlike the dev file, no ~/.aws/credentials mount and no
# AWS_SHARED_CREDENTIALS_FILE env var: boto3 inside the containers picks up
# credentials automatically from the EC2 instance's IAM role via IMDS.
#
# Uses a custom-built image (airflow/Dockerfile) with apache-airflow-providers-amazon
# baked in, instead of _PIP_ADDITIONAL_REQUIREMENTS — see that Dockerfile's
# comment for why (CPU-credit exhaustion / crash loop on small instances).
#
# The webserver is NOT part of the default `up -d` set (see its `profiles`
# below) and the scheduler is tuned down (parsing_processes/reparse interval):
# running gunicorn's 4 default workers plus a scheduler re-parsing this DAG
# file (it dynamically builds ~60 EcsRunTaskOperator tasks) every 30s pegged
# CPU at 100% and crash-looped on this instance's 2 vCPUs, confirmed live via
# SSM (load average 30+, no swap/OOM involved). The actual requirement is
# just the scheduler firing the weekly cron — the UI is a convenience, not
# on the critical path, so it only runs on demand (see
# docs/PROD_AIRFLOW_EC2_RUNBOOK.md).
#
# Default `up -d` set: postgres-airflow, scheduler, triggerer. The triggerer is
# what lets this fit on a 913MB instance at all — see the deferrable comment in
# the env block below.
#
# Measured on the instance through a full production run (2026-09-01,
# 56 tasks, 42 minutes end to end):
#
#   scheduler 270MB   triggerer 218MB   postgres 31MB   = ~518MB resident
#   peak swap in use 807MB of 2048MB
#   minimum available RAM during the run 31MB
#   oom-kills 0
#
# Two earlier revisions of this comment had this wrong in both directions:
# 620-690MB was a guess, and 800-850MB came from reading a stale container
# that had been up for ten days with default SQLAlchemy pools. The pool and
# shared_buffers settings below are what actually brought the scheduler from
# 517MB down to 270MB — the triggerer fits in the room that tuning freed.
#
# The swapfile (runbook step 4) is not a safety margin, it is what makes the
# set runnable at all: 31MB of free RAM at peak means every burst lands in
# swap. Before it existed the host OOM-killed the scheduler five times
# between Aug 30 and Aug 31 2026 and then went unreachable for four days.

x-airflow-common:
  &airflow-common
  image: 904464083417.dkr.ecr.us-east-1.amazonaws.com/camara-airflow:latest
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres-airflow:5432/airflow
    # Vazio significa "nao criptografe": qualquer senha de connection gravada
    # no metadata DB fica em claro. Hoje nao ha connection armazenada (o
    # aws_conn_id cai no boto3/IMDS), entao definir a chave agora e barato —
    # depois de existir connection criptografada, trocar a chave torna as
    # existentes ilegiveis. Vem de airflow/.env no host, fora do git.
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina AIRFLOW_FERNET_KEY em airflow/.env - veja o runbook}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AWS_DEFAULT_REGION: us-east-1
    # Topico SNS de alerta de falha, lido pelo on_failure_callback da DAG
    # (airflow/dags/camera_ingestion_dag.py). Criado em
    # camara-senado-data-infra, environments/prod/main.tf. Vazio = callback
    # vira no-op, que e o comportamento do stack local de dev.
    #
    # Atencao: mudar esta variavel NAO tem efeito nos containers ja criados —
    # o cron de sync so faz `git pull`. E preciso recriar
    # (`docker compose -f docker-compose-airflow.prod.yml up -d --force-recreate`),
    # o mesmo detalhe que anulou o cap de PARALLELISM por 10 dias.
    CAMARA_ALERT_SNS_TOPIC_ARN: ${CAMARA_ALERT_SNS_TOPIC_ARN:-arn:aws:sns:us-east-1:904464083417:dataplatform-alerts-prod}
    # Only one weekly-scheduled DAG, no need to near-real-time reparse it.
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '300'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    # Deferrable execution, switched on here rather than in the DAG file: the
    # operator reads this as the default for its `deferrable` argument, so the
    # same DAG still runs in an environment that has no triggerer.
    #
    # This is what removes the OOM cause rather than compensating for it.
    # Previously EcsRunTaskOperator waited synchronously, so LocalExecutor held
    # one forked Python subprocess (~150MB RSS) per task for the *entire*
    # Fargate task duration just to poll DescribeTasks — run_deputados_despesas
    # alone occupied a slot for 44 minutes. With deferrable the fork submits
    # ecs:RunTask, defers, and exits within seconds; the wait becomes one
    # coroutine in the triggerer's asyncio loop. Slot occupancy per task drops
    # from up to 44min to ~10s.
    AIRFLOW__OPERATORS__DEFAULT_DEFERRABLE: 'true'
    # Still 2, but for a completely different reason than before. It used to
    # cap how many tasks could *wait* at once; now a waiting task costs nothing,
    # so this only caps how many forks exist during fan-out and completion,
    # each for ~10s rather than up to 44 minutes.
    #
    # Kept at 2, now confirmed by a full run rather than argued from an
    # estimate. That run finished 56/56 in 42 minutes with peak swap at 807MB
    # and only 31MB of RAM free at its tightest — there is no headroom to
    # spend on more concurrent forks. And it would buy nothing: the critical
    # path is run_deputados_despesas at ~44 minutes, so the DAG is now bound
    # by how long the Fargate work actually takes, not by fan-out. For
    # reference, that 42 minutes beats the 43-54 minutes the same DAG took on
    # a laptop with parallelism uncapped.
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    # Bounds concurrent triggers in the triggerer process (default 1000). Each
    # one holds two aiobotocore client sessions (ECS + CloudWatch Logs), and
    # the DAG's 23 dependency-free roots set the realistic peak.
    AIRFLOW__TRIGGERER__DEFAULT_CAPACITY: '30'
    # Every Airflow process (scheduler, triggerer, each task fork) builds its
    # own connection pool. Defaults are 5 + 10 overflow each, which on 913MB
    # buys nothing but postgres backends.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: '3'
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: '3'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:15-alpine
    # Stock defaults (shared_buffers=128MB, max_connections=100) assume a much
    # bigger host. The Airflow pool settings above cap real usage near 24
    # connections, so 40 leaves margin without reserving memory for 100.
    command: postgres -c shared_buffers=48MB -c max_connections=40
    # Deliberately generous for something expected to sit near 150MB: losing
    # postgres takes Airflow down as surely as losing the scheduler, so this is
    # a runaway fence, not a target to run close to.
    mem_limit: 320m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em airflow/.env - veja o runbook}
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Not started by `docker compose up -d`. Start on demand to check the UI:
  # docker compose -f docker-compose-airflow.prod.yml --profile ui up -d webserver
  #
  # restart: "no" is deliberate: `profiles` only gates the initial `up -d`,
  # it does not stop dockerd from restarting an already-created container on
  # host reboot. With `restart: always` here, a webserver started once for a
  # UI check kept coming back on every EC2 reboot alongside the scheduler,
  # and gunicorn's workers + scheduler + postgres together OOM-crashed this
  # instance's limited RAM, taking the scheduler down with it.
  webserver:
    <<: *airflow-common
    profiles: ["ui"]
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: "no"

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # Runs every deferred task's wait in a single asyncio event loop, replacing
  # one ~150MB forked subprocess per in-flight task. Required whenever
  # AIRFLOW__OPERATORS__DEFAULT_DEFERRABLE is true — without it, deferred tasks
  # sit in the `deferred` state forever.
  #
  # mem_limit is a fence, not a target: if the triggerer ever leaks, it gets
  # killed inside its own cgroup instead of the kernel OOM-killer picking a
  # victim host-wide (which is how the scheduler died before). The scheduler is
  # deliberately left unlimited — it is the process that must survive.
  triggerer:
    <<: *airflow-common
    command: triggerer
    mem_limit: 384m
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      # Era airflow/airflow, igual ao stack de dev e commitado no repo. A UI so
      # e alcancavel por port-forward do SSM, entao nao era exploravel de fora,
      # mas uma senha em arquivo versionado nao deve existir de qualquer forma.
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?defina AIRFLOW_ADMIN_PASSWORD em airflow/.env - veja o runbook}
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags

volumes:
  postgres_airflow_data:
