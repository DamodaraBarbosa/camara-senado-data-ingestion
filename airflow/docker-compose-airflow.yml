# Configuração do Airflow Local utilizando o mecanismo de autenticação básico
# Para fins de desenvolvimento local e validação das DAGs do projeto
version: '3.8'

x-airflow-common:
  &airflow-common
  # Builds the same image prod runs (airflow/Dockerfile) instead of pulling the
  # stock one and installing the provider at every container start. Deferrable
  # execution needs the [aiobotocore] extra pinned in that Dockerfile, and
  # sharing the image is what makes local a real rehearsal for the EC2 host.
  build: .
  image: camara-airflow:local
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    # Dev: default vazio de proposito, sem atrito. Em prod isto e obrigatorio
    # (ver docker-compose-airflow.prod.yml).
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    # AWS credentials configuration
    AWS_DEFAULT_REGION: us-east-1
    AWS_SHARED_CREDENTIALS_FILE: /home/airflow/.aws/credentials
    # Match prod: EcsRunTaskOperator defers instead of blocking a LocalExecutor
    # fork for the whole Fargate task. Needs the triggerer service below.
    AIRFLOW__OPERATORS__DEFAULT_DEFERRABLE: 'true'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ~/.aws/credentials:/home/airflow/.aws/credentials:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  postgres-airflow:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  # Without this, deferred tasks sit in the `deferred` state forever.
  triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    user: "0:0"
    volumes:
      - ./dags:/opt/airflow/dags

volumes:
  postgres_airflow_data:
