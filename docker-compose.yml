version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: camara-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: camara_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - camara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d camara_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  extractor-proposicoes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camara-extractor-proposicoes
    environment:
      BUNDLE: proposicoes
      RUN_ID: docker-compose-run
      DEBUG_MODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - camara-network
    restart: on-failure
    volumes:
      - ./src:/app/src:ro
      - ./bundles:/app/bundles:ro

  extractor-deputados:
